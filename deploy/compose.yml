# Self-hosted Copilot: Postgres, a one-off migrate step, and the server, from one image.
#
#   export SECRET_KEY="$(openssl rand -base64 32)" DB_PASSWORD="$(openssl rand -hex 24)" \
#     DB_SERVER_PASSWORD="$(openssl rand -hex 24)" COPILOT_IMAGE=ghcr.io/host39/copilot:0.1.0
#   docker compose -f deploy/compose.yml pull && docker compose -f deploy/compose.yml up -d --no-build
#
# Without COPILOT_IMAGE, `up -d --build` builds the image from this checkout as copilot:local.
#
# Keep the three secrets (for example in deploy/.env, which compose reads): a new SECRET_KEY
# makes every stored provider key unreadable. Install and upgrade are the same command:
# `migrate` connects as the database owner (`copilot`), applies lib-rustauth's `auth`
# migrations, then Copilot's, and grants the server's role (`copilot_server`, password
# DB_SERVER_PASSWORD) the rows of every table and nothing more; the server starts only after
# it succeeds and never holds the owner's password. The server listens on 127.0.0.1:3000; put
# a TLS reverse proxy in front for other hosts (docs/self-hosting.md). See docs/env.md
# for every variable.
name: copilot

x-database: &database
  ENVIRONMENT: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: copilot
  # Postgres is reachable only on the compose network.
  DB_SSL: "false"

services:
  postgres:
    image: postgres:18.1@sha256:1090bc3a8ccfb0b55f78a494d76f8d603434f7e4553543d6e807bc7bd6bbd17f
    environment:
      POSTGRES_DB: copilot
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot -d copilot"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  migrate:
    image: ${COPILOT_IMAGE:-copilot:local}
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["migrate"]
    environment:
      <<: *database
      DB_USER: copilot
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      DB_SERVER_PASSWORD: ${DB_SERVER_PASSWORD:?set DB_SERVER_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  copilot:
    image: ${COPILOT_IMAGE:-copilot:local}
    environment:
      <<: *database
      DB_USER: copilot_server
      DB_PASSWORD: ${DB_SERVER_PASSWORD:?set DB_SERVER_PASSWORD}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY (openssl rand -base64 32)}
      ALLOW_PRIVATE_NETWORK: ${ALLOW_PRIVATE_NETWORK:-admins}
      AUTH_REGISTRATION_OPEN: ${AUTH_REGISTRATION_OPEN:-false}
      # Unset: the server logs a setup token once (`rustauth.setup.token-issued`).
      AUTH_SETUP_TOKEN: ${AUTH_SETUP_TOKEN:-}
      # Whose X-Forwarded-For the per-IP sign-in limits trust. Every connection through the
      # published port reaches the server from the network's gateway (Docker's port proxy), so
      # the default trusts it: a reverse proxy on this host then passes each client's address.
      # Safe because the port is published on the host's loopback only. A proxy inside this
      # network: list its address instead.
      AUTH_TRUSTED_PROXIES: ${AUTH_TRUSTED_PROXIES:-172.31.239.1}
      # The address people reach Copilot at (https://copilot.example.com), for tool server
      # sign-in with OAuth. Unset: sign-in is off.
      PUBLIC_URL: ${PUBLIC_URL:-}
      OAUTH_CLIENT_METADATA: ${OAUTH_CLIENT_METADATA:-true}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # On SIGTERM, answers being written get 5 seconds to finish, then up to 10 to save what
    # they have (SHUTDOWN_GRACE_SECS, SHUTDOWN_DRAIN_SECS); Docker's default of 10 would cut that.
    stop_grace_period: 20s

# A fixed subnet, so the gateway the server sees is known (AUTH_TRUSTED_PROXIES). If it
# overlaps a network of this host, set COPILOT_SUBNET and COPILOT_GATEWAY, and
# AUTH_TRUSTED_PROXIES to the same gateway.
networks:
  default:
    ipam:
      config:
        - subnet: ${COPILOT_SUBNET:-172.31.239.0/24}
          gateway: ${COPILOT_GATEWAY:-172.31.239.1}

volumes:
  postgres:
