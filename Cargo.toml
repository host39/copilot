[workspace]
resolver = "3"
members = ["apps/api", "packages/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
publish = false
license = "PolyForm-Noncommercial-1.0.0"

[workspace.dependencies]
# Internal crates
copilot-contracts = { path = "packages/contracts" }
copilot-core = { path = "packages/core" }
copilot-database = { path = "packages/database" }
copilot-logger = { path = "packages/logger" }
copilot-middleware = { path = "packages/middleware" }

# External crates
async-trait = "0.1.89"
axum = "0.8.9"
http-body-util = "0.1.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.9.1", default-features = false }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tower = "0.5.2"
tower-http = "0.7.1"
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
ts-rs = "12.0.1"
utoipa = "6.0.0"
utoipa-axum = "0.3.0"
uuid = "1.18.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cognitive_complexity = "warn"
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "warn"
