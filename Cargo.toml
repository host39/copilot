[workspace]
resolver = "3"
members = ["apps/api", "packages/*"]
# The Tauri shell builds on its own, so `make check` never needs WebKitGTK headers.
exclude = ["apps/native/src-tauri"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
publish = false
license = "PolyForm-Noncommercial-1.0.0"

[workspace.dependencies]
# Internal crates
copilot-contracts = { path = "packages/contracts" }
copilot-core = { path = "packages/core" }
copilot-database = { path = "packages/database" }
copilot-logger = { path = "packages/logger" }
copilot-mcp = { path = "packages/mcp" }
copilot-middleware = { path = "packages/middleware" }
copilot-providers = { path = "packages/providers" }
copilot-security = { path = "packages/security" }

# lib-rustauth: identity (users, sessions, roles, the `auth` schema). Use the facade only; members
# enable the features they need (docs/integration.md in lib-rustauth). Pinned by commit until the
# first release tag; a bump is its own commit (see docs/design/roadmap.md, "How Copilot Pins It").
rustauth = { git = "https://github.com/host39/lib-rustauth", rev = "c88666f8ff43281f6f04c6d68f1e39e287df1d7e", default-features = false }

# External crates. Versions and features: docs/research/dependencies.md (rmcp: docs/research/mcp.md).
# Keep aws-lc-rs out of the tree (`cargo tree -i aws-lc-rs` prints nothing): sqlx uses ring, so
# reqwest takes `rustls-no-provider` and each binary installs the ring provider at startup.
aes-gcm = "0.11.1"
async-trait = "0.1.89"
axum = "0.8.9"
base64 = "0.23.1"
bytes = "1.12.2"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
croner = { version = "5.0.1", default-features = false, features = ["std", "jiff"] }
futures-core = "0.3.34"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
getrandom = "0.4.3"
http-body-util = "0.1.3"
jiff = { version = "1.0.3", default-features = false, features = ["std", "tzdb-zoneinfo", "tzdb-bundle-always"] }
# Inflates PDF object streams to count their pages (pure Rust, no unsafe in the inflater).
miniz_oxide = "0.9.1"
mime_guess = { version = "2.0.5", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "stream", "multipart"] }
# MCP client over Streamable HTTP only: the default features are server-side, and rmcp's `reqwest`
# feature would enable reqwest's aws-lc-rs provider.
rmcp = { version = "3.12.0", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11.2"
sqlx = { version = "0.9.1", default-features = false }
sse-stream = { version = "0.3.0", default-features = false }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tokio-stream = { version = "0.1.19", default-features = false }
tokio-util = { version = "0.7.20", default-features = false }
tower = "0.5.2"
tower-http = "0.7.1"
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
ts-rs = "12.0.1"
url = "2.5.9"
utoipa = "6.0.0"
utoipa-axum = "0.3.0"
uuid = { version = "1.29.3", features = ["v4", "v7", "serde"] }
wiremock = "0.6.5"
zeroize = { version = "1.9.2", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cognitive_complexity = "warn"
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "warn"
