[package]
name = "copilot-native"
version = "0.1.0"
description = "Copilot for Linux and Android: a Tauri shell around the web app"
edition = "2024"
rust-version = "1.94"
publish = false
license = "PolyForm-Noncommercial-1.0.0"

[lib]
# The `_lib` suffix keeps the library apart from the binary of the same package on Windows.
name = "copilot_native_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
tauri = { version = "2.12.7", features = [] }
tauri-plugin-http = { version = "2.9.0", default-features = false, features = ["rustls-tls", "http2"] }
tauri-plugin-opener = "2.7.3"

# The workspace's Clippy lints; this crate is outside the root workspace and cannot inherit them.
# `unsafe_code` is left out: Tauri's Android entry point expands to `no_mangle` JNI functions here.
[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "warn"

# Small release binaries (docs/research/native-and-ci.md, section 3).
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
