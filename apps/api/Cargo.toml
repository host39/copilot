[package]
name = "copilot-api"
description = "axum HTTP adapter: wires dependencies, OpenAPI routes, and entrypoints."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
default-run = "server"

[[bin]]
name = "server"
path = "src/bin/server.rs"

[dependencies]
axum = { workspace = true }
copilot-contracts = { workspace = true }
copilot-core = { workspace = true }
copilot-database = { workspace = true }
copilot-logger = { workspace = true }
copilot-middleware = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true }
utoipa-axum = { workspace = true }

[dev-dependencies]
http-body-util = { workspace = true }
# `#[sqlx::test]` database tests (`make test-db`).
sqlx = { workspace = true, features = ["macros", "migrate", "postgres", "runtime-tokio"] }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
