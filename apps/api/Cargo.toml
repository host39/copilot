[package]
name = "copilot-api"
description = "axum HTTP adapter: wires dependencies, OpenAPI routes, and entrypoints."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
default-run = "server"

[[bin]]
name = "server"
path = "src/bin/server.rs"

[dependencies]
async-trait = { workspace = true }
# Uploads (`routes::files`).
axum = { workspace = true, features = ["multipart"] }
# Audio deltas in stream events.
base64 = { workspace = true }
# The scheduler's clock (`helpers::scheduler`).
chrono = { workspace = true }
copilot-contracts = { workspace = true }
copilot-core = { workspace = true }
copilot-database = { workspace = true }
copilot-logger = { workspace = true }
copilot-mcp = { workspace = true }
copilot-middleware = { workspace = true }
copilot-providers = { workspace = true }
copilot-security = { workspace = true }
futures-util = { workspace = true }
# Identity: the router, guard, and Postgres storage. Only `helpers/auth.rs` names it.
rustauth = { workspace = true, features = ["axum", "postgres"] }
# Query strings (`routes::path::Params`).
serde = { workspace = true }
serde_json = { workspace = true }
# `sync`: the run registry's broadcast channels and the upload slots' semaphores.
tokio = { workspace = true, features = ["sync"] }
# `sync::CancellationToken`: the root token that shutdown cancels; `rt`: the task tracker that
# shutdown waits on for scheduled runs to record how they ended.
tokio-util = { workspace = true, features = ["rt"] }
# Serves the web bundle (`WEB_DIR`).
tower-http = { workspace = true, features = ["fs"] }
tracing = { workspace = true }
utoipa = { workspace = true, features = ["uuid"] }
utoipa-axum = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
http-body-util = { workspace = true }
# An in-process MCP server for the tool server test route (`make test-db`).
rmcp = { workspace = true, features = ["server", "transport-streamable-http-server"] }
# Checks the hash of Swagger UI's inline script against its Content-Security-Policy.
sha2 = { workspace = true }
# The real router and guard on in-memory fakes, for route tests without Postgres.
rustauth = { workspace = true, features = ["axum", "postgres", "testing"] }
# `#[sqlx::test]` database tests (`make test-db`).
sqlx = { workspace = true, features = ["macros", "migrate", "postgres", "runtime-tokio"] }
tower = { workspace = true, features = ["util"] }
# A model provider for the end-to-end turn test.
wiremock = { workspace = true }

[lints]
workspace = true
