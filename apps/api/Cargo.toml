[package]
name = "copilot-api"
description = "axum HTTP adapter: wires dependencies, OpenAPI routes, and entrypoints."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
default-run = "server"

[features]
# Builds the optional AWS Lambda entrypoint (`src/bin/lambda.rs`). See docs/deployment-lambda.md.
lambda = ["dep:lambda_http"]

[[bin]]
name = "server"
path = "src/bin/server.rs"

[[bin]]
name = "lambda"
path = "src/bin/lambda.rs"
required-features = ["lambda"]

[dependencies]
axum = { workspace = true }
lambda_http = { workspace = true, optional = true }
copilot-contracts = { workspace = true }
copilot-core = { workspace = true }
copilot-database = { workspace = true }
copilot-logger = { workspace = true }
copilot-middleware = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true }
utoipa-axum = { workspace = true }

[dev-dependencies]
http-body-util = { workspace = true }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
