[package]
name = "copilot-core"
description = "Domain entities, services, repository ports, and shared errors."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
# In-memory fakes of every port (`copilot_core::testing`). Enable it only under
# `[dev-dependencies]` of other crates.
testing = []

[dependencies]
async-trait = { workspace = true }
# PKCE challenges and sign-in values are base64url.
base64 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
croner = { workspace = true }
futures-util = { workspace = true }
# The PKCE verifier and the `state` of a tool server sign-in.
getrandom = { workspace = true }
jiff = { workspace = true }
miniz_oxide = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
# `sync::CancellationToken` only; brings in tokio's `sync` feature, no runtime.
tokio-util = { workspace = true }
# The facade only; `copilot-logger` installs the subscriber.
tracing = { workspace = true }
url = { workspace = true }
# `url`'s IDNA mapping on the unicode-rs back end (the idna crate documents this opt-in): 1.2
# would pull in ICU4X, about twenty crates. Named here so `cargo update` keeps it.
idna_adapter = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
