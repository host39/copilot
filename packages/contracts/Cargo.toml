[package]
name = "copilot-contracts"
description = "Transport DTOs shared by the API (OpenAPI) and the web app (TypeScript bindings)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# Timestamps on the wire are RFC 3339 strings (`DateTime<Utc>`), ids are UUID strings.
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
utoipa = { workspace = true, features = ["chrono", "uuid"] }
uuid = { workspace = true }

[dev-dependencies]
# Bindings are generated by `cargo test -p copilot-contracts` (see `make contracts`). ts-rs does
# not read `deserialize_with` (the PATCH helper); `optional_fields` gives those fields their shape,
# so its warning about the attribute is turned off.
ts-rs = { workspace = true, features = [
  "chrono-impl",
  "no-serde-warnings",
  "serde-json-impl",
  "uuid-impl",
] }

[lints]
workspace = true
