[package]
name = "copilot-database"
description = "Postgres client, migrations, seed, and sqlx repository implementations."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
async-trait = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
copilot-core = { workspace = true }
copilot-logger = { workspace = true }
# The `auth` schema migrations only, which run before Copilot's (no HTTP or hashing crates).
rustauth = { workspace = true, features = ["migrate"] }
sqlx = { workspace = true, features = [
  "chrono",
  "json",
  "macros",
  "migrate",
  "postgres",
  "runtime-tokio",
  "tls-rustls-ring-webpki",
  "uuid",
] }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# Ids for the schema tests (`tests/schema`).
uuid = { workspace = true }

[lints]
workspace = true
