name: Image

# Builds the Copilot image and starts deploy/compose.yml (Postgres, migrate, server), then checks
# that the server is ready, serves the web bundle, registers the first account, connects as the
# unprivileged server role, and keys per-IP limits on the forwarded client address. Then it runs
# the documented upgrade order again on the same image (migrate must change nothing), and the
# documented backup (deploy/backup.sh) and restore onto an empty volume. Runs when
# the image's inputs change on main and claude/** branches, on version tags (tag pushes ignore
# path filters), and on demand.
#
# On a version tag the `publish` job pushes the image this run tested to ghcr.io/host39/copilot
# as <version>, <major.minor>, and latest (a pre-release gets only its own tag). A manual run
# goes through the same job up to the push, so the release path is exercised before a tag.
on:
  push:
    branches: ["main", "claude/**"]
    tags: ["v*"]
    paths:
      - Dockerfile
      - .dockerignore
      - deploy/**
      - Cargo.lock
      - pnpm-lock.yaml
      - .github/workflows/image.yml
      - scripts/footprint.sh
      - scripts/release.sh
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push replaces a branch's run; a tag's run always finishes.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  compose:
    name: Image and compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AUTH_SETUP_TOKEN: ci-setup-token-0123456789
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and start
        run: |
          echo "SECRET_KEY=$(openssl rand -base64 32)" >deploy/.env
          echo "DB_PASSWORD=$(openssl rand -hex 24)" >>deploy/.env
          echo "DB_SERVER_PASSWORD=$(openssl rand -hex 24)" >>deploy/.env
          docker compose -f deploy/compose.yml up -d --build

      - name: Image footprint
        run: bash scripts/footprint.sh image copilot:local

      - name: Wait for the server
        run: |
          for _ in $(seq 1 90); do
            curl -sf http://127.0.0.1:3000/health/ready && exit 0
            sleep 2
          done
          exit 1

      - name: Smoke test
        run: |
          set -euo pipefail
          base=http://127.0.0.1:3000
          test "$(docker inspect -f '{{.State.ExitCode}}' copilot-migrate-1)" = 0
          curl -sf "$base/api/auth/setup" | grep -q '"needsSetup":true'
          curl -sf "$base/" | grep -qi '<!doctype html'
          curl -sfI "$base/chats/123" | grep -qi '^content-security-policy:'
          curl -sf "$base/api/doc" | grep -q '"/api/settings"'
          status="$(curl -s -o /dev/null -w '%{http_code}' "$base/api/settings")"
          test "$status" = 401
          token="$(curl -sf -X POST "$base/api/auth/register" -H 'content-type: application/json' \
            -d "{\"username\":\"admin\",\"password\":\"compose-smoke-password\",\"displayName\":\"Admin\",\"setupToken\":\"$AUTH_SETUP_TOKEN\"}" \
            | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')"
          test -n "$token"
          curl -sf "$base/api/auth/me" -H "authorization: Bearer $token" | grep -q '"role":"administrator"'

      - name: Server role
        run: |
          set -euo pipefail
          sql() { docker compose -f deploy/compose.yml exec -T postgres psql -U copilot -d copilot -tAc "$1"; }
          test "$(sql "SELECT rolsuper OR rolcreatedb OR rolcreaterole FROM pg_roles WHERE rolname = 'copilot_server'")" = f
          test "$(sql "SELECT count(*) > 0 FROM pg_stat_activity WHERE usename = 'copilot_server'")" = t
          test "$(sql "SELECT count(*) FROM pg_stat_activity WHERE usename = 'copilot' AND backend_type = 'client backend' AND pid <> pg_backend_pid()")" = 0

      - name: Forwarded client address
        run: |
          set -euo pipefail
          # The public auth routes allow 60 requests per client address and minute. Spend one
          # forwarded address's budget; another forwarded address must still get through.
          status() {
            curl -s -o /dev/null -w '%{http_code}' -H "x-forwarded-for: $1" http://127.0.0.1:3000/api/auth/setup
          }
          limited=""
          for _ in $(seq 1 70); do
            if [ "$(status 198.51.100.7)" = 429 ]; then limited=yes; break; fi
          done
          test "$limited" = yes
          test "$(status 198.51.100.8)" = 200

      # The upgrade order of docs/self-hosting.md with nothing new to apply: migrate runs again
      # and must change nothing, and the server comes back with the same data.
      - name: Migrate again
        run: |
          set -euo pipefail
          dc() { docker compose -f deploy/compose.yml "$@"; }
          sql() { dc exec -T postgres psql -U copilot -d copilot -tAc "$1"; }
          applied() {
            sql "SELECT (SELECT count(*) FROM auth._sqlx_migrations) || '/' || (SELECT count(*) FROM public._sqlx_migrations) || '/' || (SELECT max(installed_on) FROM public._sqlx_migrations)"
          }
          before="$(applied)"
          started="$(docker inspect -f '{{.State.StartedAt}}' copilot-migrate-1)"
          dc stop copilot
          dc up -d --no-build
          test "$(docker inspect -f '{{.State.StartedAt}}' copilot-migrate-1)" != "$started"
          test "$(docker inspect -f '{{.State.ExitCode}}' copilot-migrate-1)" = 0
          test "$(applied)" = "$before"
          dc logs --no-color migrate | grep -q 'database.migrate.applied'
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:3000/health/ready >/dev/null && break
            sleep 1
          done
          token="$(curl -sf -X POST http://127.0.0.1:3000/api/auth/login -H 'content-type: application/json' \
            -d '{"username":"admin","password":"compose-smoke-password"}' | jq -er .data.token)"
          curl -sf http://127.0.0.1:3000/api/auth/me -H "authorization: Bearer $token" | jq -e '.data.role == "administrator"'

      # docs/self-hosting.md, "Backups": deploy/backup.sh writes the dump; then everything is lost
      # (down -v), Postgres starts empty, the documented pg_restore runs, and `up` (whose migrate
      # grants the server's role again) brings the server back with the data.
      - name: Backup and restore
        run: |
          set -euo pipefail
          dc() { docker compose -f deploy/compose.yml "$@"; }
          sql() { dc exec -T postgres psql -U copilot -d copilot -tAc "$1"; }
          base=http://127.0.0.1:3000
          login() {
            curl -sf -X POST "$base/api/auth/login" -H 'content-type: application/json' \
              -d '{"username":"admin","password":"compose-smoke-password"}' | jq -er .data.token
          }
          token="$(login)"
          curl -sf -X POST "$base/api/projects" -H "authorization: Bearer $token" \
            -H 'content-type: application/json' -d '{"name":"Restore check"}' | jq -e '.data.id'

          BACKUP_DIR="$RUNNER_TEMP/backups" sh deploy/backup.sh
          dump="$(find "$RUNNER_TEMP/backups" -name 'copilot-*.dump' -type f)"
          test "$(printf '%s\n' "$dump" | wc -l)" = 1
          test "$(stat -c %a "$dump")" = 600

          dc down -v
          dc up -d --wait postgres
          test "$(sql "SELECT count(*) FROM pg_roles WHERE rolname = 'copilot_server'")" = 0
          dc exec -T postgres \
            pg_restore -U copilot -d copilot --clean --if-exists --no-owner --no-privileges <"$dump"
          dc up -d --no-build
          for _ in $(seq 1 60); do
            curl -sf "$base/health/ready" >/dev/null && break
            sleep 1
          done
          test "$(docker inspect -f '{{.State.ExitCode}}' copilot-migrate-1)" = 0

          # The administrator signs in with the old password and finds the project, read by the
          # server through copilot_server.
          token="$(login)"
          curl -sf "$base/api/auth/me" -H "authorization: Bearer $token" | jq -e '.data.role == "administrator"'
          curl -sf "$base/api/projects" -H "authorization: Bearer $token" \
            | jq -e '[.items[].name] | index("Restore check") != null'
          # migrate granted the recreated server role every restored table again.
          test "$(sql "SELECT count(*) FROM pg_stat_activity WHERE usename = 'copilot_server'")" -gt 0
          missing="$(sql "SELECT string_agg(n.nspname || '.' || c.relname, ', ')
            FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
            WHERE c.relkind IN ('r', 'p') AND n.nspname IN ('public', 'auth')
              AND c.relname <> '_sqlx_migrations'
              AND NOT has_table_privilege('copilot_server', c.oid, 'SELECT, INSERT, UPDATE, DELETE')")"
          test -z "$missing" || { echo "::error::copilot_server cannot write: $missing"; exit 1; }

      # The image this run tested goes to the publish job: on version tags, and on manual runs,
      # which stop before pushing.
      - name: Save the image
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: docker save copilot:local | gzip -1 >"$RUNNER_TEMP/copilot-image.tar.gz"

      - name: Upload the image
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/copilot-image.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 1

      - name: Logs
        if: always()
        run: docker compose -f deploy/compose.yml logs --no-color

      - name: Stop
        if: always()
        run: docker compose -f deploy/compose.yml down -v

  # Pushes the tested image, never a rebuild. Only this job may write packages.
  publish:
    name: Publish the image
    needs: compose
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/host39/copilot
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A tag must name the version in Cargo.toml and apps/native/package.json.
      - name: Version
        id: version
        run: |
          set -euo pipefail
          version="$(bash scripts/release.sh version)"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            bash scripts/release.sh check "$GITHUB_REF_NAME"
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Download the image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: copilot-image.tar.gz
          path: ${{ runner.temp }}/image

      - name: Load and tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          archive="$(find "$RUNNER_TEMP/image" -type f -name 'copilot-image.tar.gz' | head -n 1)"
          test -n "$archive"
          gunzip -c "$archive" | docker load
          : >"$RUNNER_TEMP/refs.txt"
          for tag in $(bash scripts/release.sh tags "$VERSION"); do
            docker tag copilot:local "$IMAGE:$tag"
            echo "$IMAGE:$tag" >>"$RUNNER_TEMP/refs.txt"
          done
          cat "$RUNNER_TEMP/refs.txt"
          docker image inspect "$IMAGE:$VERSION" --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' \
            | grep -qx 'https://github.com/host39/copilot'

      - name: Push
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          while read -r ref; do
            docker push "$ref"
          done <"$RUNNER_TEMP/refs.txt"
          {
            echo "Published:"
            echo
            sed 's/^/- `/; s/$/`/' "$RUNNER_TEMP/refs.txt"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          docker logout ghcr.io

      - name: Not pushed
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          {
            echo "A manual run stops here; a version tag pushes:"
            echo
            sed 's/^/- `/; s/$/`/' "$RUNNER_TEMP/refs.txt"
          } | tee -a "$GITHUB_STEP_SUMMARY"
