name: Code quality

on:
  pull_request:
  push:
    branches: ["claude/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Cheap checks on the smallest runner (1 vCPU, no Docker, no Rust), so they fail fast.
  lint:
    name: Lint and web
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome
        run: pnpm biome ci .

      - name: Run markdownlint
        run: pnpm check:markdown

      - name: Type check
        run: pnpm type-check

      - name: Run TypeScript tests
        run: pnpm test

      - name: Build web
        run: pnpm --filter @copilot/web build

      - name: Web footprint
        run: bash scripts/footprint.sh web apps/web/dist

  # Everything that needs Rust or Postgres.
  rust:
    name: Rust and Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    services:
      postgres:
        image: postgres:18.1@sha256:1090bc3a8ccfb0b55f78a494d76f8d603434f7e4553543d6e807bc7bd6bbd17f
        env:
          POSTGRES_DB: copilot
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d copilot"
          --health-interval 2s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Node runs the boundaries script and the Bruno CLI.
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Validate lockfiles
        run: |
          pnpm install --frozen-lockfile
          cargo fetch --locked

      - name: Prepare API env for CI
        run: bash scripts/env-local.sh

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Check Rust import paths
        run: bash scripts/lint-rust-imports.sh

      - name: Enforce dependency boundaries
        run: make boundaries

      - name: Run unit tests
        run: cargo test --workspace --locked

      - name: Run migrations
        run: make migrate

      - name: Run database tests
        run: make test-db

      # `make contracts` rewrites the bindings and the conformance fixtures that the TypeScript
      # tests (lint job) parse with the Zod schemas; the committed files must match.
      - name: Check contract bindings and fixtures are current
        run: |
          make contracts
          git diff --exit-code -- packages/contracts/ts/generated packages/contracts/test/fixtures
          test -z "$(git ls-files --others --exclude-standard -- packages/contracts/ts/generated packages/contracts/test/fixtures)"

      - name: Build API (release)
        run: cargo build --release --locked -p copilot-api -p copilot-database

      - name: Binary footprint
        run: bash scripts/footprint.sh binaries target/release

      # A build of its own, so fake-llm's rmcp server features never reach the API binaries.
      - name: Build fake-llm (release)
        run: cargo build --release --locked -p fake-llm

      # The API against tools/fake-llm over HTTP (scripts/smoke.sh): register, OpenAI-compatible
      # and Anthropic connections, streamed replies, a provider error, and an approved MCP tool
      # call, on the release binaries just built and a throwaway database on the Postgres service.
      # It runs here rather than in a job of its own, so the binaries of a pull request (a fork's
      # included) never become an artifact in this repository's run list.
      # curl and jq come with the runner image; psql creates and drops the throwaway database.
      - name: Run the smoke test
        run: |
          command -v psql || (sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client)
          command -v jq curl
          SMOKE_BIN_DIR=target/release bash scripts/smoke.sh

      - name: Run Bruno smoke tests
        run: make test-bruno
