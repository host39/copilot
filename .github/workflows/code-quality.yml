name: Code quality

on:
  pull_request:
  push:
    branches: ["claude/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
    services:
      postgres:
        image: postgres:18.1
        env:
          POSTGRES_DB: copilot
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d copilot"
          --health-interval 2s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Validate lockfiles
        run: |
          pnpm install --frozen-lockfile
          cargo fetch --locked

      - name: Prepare API env for CI
        run: cp apps/api/.env.sample apps/api/.env.local

      - name: Run migrations
        run: make migrate

      - name: Run Biome
        run: pnpm biome ci .

      - name: Run markdownlint
        run: pnpm check:markdown

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Check Rust import paths
        run: bash scripts/lint-rust-imports.sh

      - name: Type check
        run: pnpm type-check

      - name: Enforce dependency boundaries
        run: make boundaries

      - name: Run unit tests
        run: cargo test --workspace --locked

      - name: Run database tests
        run: make test-db

      - name: Check contract bindings are current
        run: |
          make contracts
          git diff --exit-code -- packages/contracts/ts/generated
          test -z "$(git ls-files --others --exclude-standard -- packages/contracts/ts/generated)"

      - name: Build API
        run: cargo build --release --locked -p copilot-api -p copilot-database

      - name: Run Bruno smoke tests
        run: make test-bruno

      - name: Build web
        run: pnpm --filter @copilot/web build
