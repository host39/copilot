name: Native apps

# Builds the Tauri shell (apps/native) around the production web build and uploads each bundle as a
# workflow artifact: the .deb and the AppImage built on Ubuntu 24.04 (glibc 2.39 floor), and the
# arm64 APK (release-signed on tags, debug-signed otherwise). Runs on version tags, on demand, and
# when the shell, the web app it bundles, or what builds them changes (the Make targets, the
# toolchains, the pnpm lockfile that pins the Tauri CLI and its JS packages, and the contracts the
# web app imports). The workflow-level path filter skips the run entirely otherwise, so no
# path-filter job is needed; tag pushes ignore path filters and always build.
#
# Pull requests from forks build and check the bundles but upload none: their artifacts would sit
# in this repository's run list under the same names as trusted builds.
#
# On a version tag the `release` job attaches the three bundles and their SHA256SUMS to the tag's
# GitHub Release, with that version's CHANGELOG.md section as the notes. A manual run goes
# through the same job up to the release, so the release path is exercised before a tag.
on:
  push:
    branches: ["main", "claude/**"]
    tags: ["v*"]
    paths:
      - apps/native/**
      - apps/web/**
      - packages/contracts/**
      - .github/workflows/native.yml
      - Makefile
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .nvmrc
      - rust-toolchain.toml
      - scripts/release.sh
  pull_request:
    paths:
      - apps/native/**
      - apps/web/**
      - packages/contracts/**
      - .github/workflows/native.yml
      - Makefile
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .nvmrc
      - rust-toolchain.toml
      - scripts/release.sh
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push replaces a branch's run; a tag's run always finishes.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Tag builds are kept like releases; branch and pull request builds are for trying a change.
  RETENTION_DAYS: ${{ startsWith(github.ref, 'refs/tags/') && 90 || 14 }}

jobs:
  # Pinned, not ubuntu-latest: the .deb and the AppImage need the build system's glibc or newer.
  native-linux:
    name: Linux bundles
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # WebKitGTK and the libraries Tauri links; patchelf, file, and xdg-utils for the AppImage.
      - name: Install WebKitGTK and bundler packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev patchelf file xdg-utils

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/native/src-tauri -> target

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The shell's crate is outside the root workspace, so the Rust job never lints it.
      - name: Lint the shell
        run: make native-lint

      - name: Test the shell
        run: make native-test

      # beforeBuildCommand builds apps/web first.
      - name: Build the .deb and the AppImage
        run: pnpm --filter @copilot/native tauri build --bundles deb,appimage

      - name: Check the bundles
        id: bundles
        run: |
          set -euo pipefail
          version="$(jq -r .version apps/native/package.json)"
          dir=apps/native/src-tauri/target/release/bundle
          deb="$dir/deb/Copilot_${version}_amd64.deb"
          appimage="$dir/appimage/Copilot_${version}_amd64.AppImage"
          ls -l "$deb" "$appimage"
          dpkg-deb --field "$deb" Package Version Architecture Depends
          test "$(dpkg-deb --field "$deb" Version)" = "$version"
          depends="$(dpkg-deb --field "$deb" Depends)"
          [[ "$depends" == *libwebkit2gtk-4.1-0* ]]
          # The binary must not need a glibc newer than Ubuntu 24.04's 2.39.
          root="$RUNNER_TEMP/deb"
          dpkg-deb -x "$deb" "$root"
          glibc="$(objdump -T "$root"/usr/bin/* | grep -o 'GLIBC_[0-9.]*' | sed 's/^GLIBC_//' | sort -uV | tail -n 1)"
          echo "Newest glibc symbol: $glibc"
          test "$(printf '%s\n' "$glibc" 2.39 | sort -V | tail -n 1)" = 2.39
          # The runtime is a static-pie ELF, so `file` says "pie executable"; the type 2 AppImage
          # magic ("AI" and 2) sits at byte 8 of the ELF header.
          kind="$(file -b "$appimage")"
          echo "AppImage: $kind"
          [[ "$kind" == "ELF 64-bit LSB "*", x86-64,"* ]]
          test "$(od -An -tx1 -j 8 -N 3 "$appimage" | tr -d ' \n')" = 414902
          {
            echo "| Artifact | Bytes |"
            echo "| --- | --- |"
            for bundle in "$deb" "$appimage"; do
              echo "| \`$(basename "$bundle")\` | $(stat -c %s "$bundle") |"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "deb=$deb" >>"$GITHUB_OUTPUT"
          echo "appimage=$appimage" >>"$GITHUB_OUTPUT"

      # One file per artifact, not zipped: the artifact is named after the file and downloads as it.
      - name: Upload the .deb
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.bundles.outputs.deb }}
          archive: false
          if-no-files-found: error
          retention-days: ${{ env.RETENTION_DAYS }}

      - name: Upload the AppImage
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.bundles.outputs.appimage }}
          archive: false
          if-no-files-found: error
          retention-days: ${{ env.RETENTION_DAYS }}

  # The image's Android SDK and NDKs make the standard runner the smallest that works; glibc does
  # not matter for Android.
  native-android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            apps/native/src-tauri/gen/android/**/*.gradle*
            apps/native/src-tauri/gen/android/**/gradle-wrapper.properties

      # The image ships NDK 27, 29, and 30; Tauri 2.12's CLI installs 29 and 30 is untested with it.
      - name: Use the preinstalled NDK 29
        run: |
          set -euo pipefail
          ndk="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -name '29.*' | sort -V | tail -n 1)"
          if [ -z "$ndk" ]; then
            echo "::error::No NDK 29 under $ANDROID_HOME/ndk"
            ls -1 "$ANDROID_HOME/ndk"
            exit 1
          fi
          echo "NDK_HOME=$ndk" | tee -a "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/native/src-tauri -> target

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Tag builds are releases: they are signed with the release keystore from the repository
      # secrets and fail without it (apps/native/README.md, "Release Signing"). Branch, pull
      # request, and manual builds are signed with the runner's SDK debug key.
      - name: Release keystore
        if: startsWith(github.ref, 'refs/tags/')
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Tag builds need the release keystore: add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD to the repository secrets (apps/native/README.md)"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d >"$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >>"$GITHUB_ENV"

      - name: Build the arm64 APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/') && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ startsWith(github.ref, 'refs/tags/') && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/') && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: make android-build

      - name: Check the APK
        id: apk
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -euo pipefail
          version="$(jq -r .version apps/native/package.json)"
          mapfile -t apks < <(find apps/native/src-tauri/gen/android/app/build/outputs/apk -name '*.apk')
          printf '%s\n' "${apks[@]}"
          test "${#apks[@]}" = 1
          apk="${apks[0]}"
          tools="$ANDROID_HOME/build-tools/$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          # Tag builds carry the release signature; every other build an SDK debug key, so it
          # installs by sideloading.
          "$tools/apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
          if [ "$IS_TAG" = true ]; then
            if grep -q 'CN=Android Debug' "$RUNNER_TEMP/certs.txt"; then
              echo "::error::The tag build is signed with a debug key"
              exit 1
            fi
          else
            grep -q 'CN=Android Debug' "$RUNNER_TEMP/certs.txt"
          fi
          signer="$(grep -m 1 'certificate SHA-256 digest' "$RUNNER_TEMP/certs.txt" | sed 's/.*digest: //')"
          # Native code for arm64 phones only.
          unzip -Z1 "$apk" 'lib/*' >"$RUNNER_TEMP/libs.txt"
          cat "$RUNNER_TEMP/libs.txt"
          test "$(cut -d/ -f2 "$RUNNER_TEMP/libs.txt" | sort -u)" = arm64-v8a
          grep -qx 'lib/arm64-v8a/libcopilot_native_lib.so' "$RUNNER_TEMP/libs.txt"
          "$tools/aapt2" dump badging "$apk" >"$RUNNER_TEMP/badging.txt"
          package="$(head -n 1 "$RUNNER_TEMP/badging.txt")"
          echo "$package"
          [[ "$package" == "package: name='com.host39.copilot' "* ]]
          [[ "$package" == *" versionName='$version'"* ]]
          # The microphone for push to talk, never the camera (apps/native/README.md).
          grep -E "^uses-(permission|feature)" "$RUNNER_TEMP/badging.txt"
          grep -qx "uses-permission: name='android.permission.RECORD_AUDIO'" "$RUNNER_TEMP/badging.txt"
          grep -qx "uses-permission: name='android.permission.MODIFY_AUDIO_SETTINGS'" "$RUNNER_TEMP/badging.txt"
          if grep -q "android.permission.CAMERA" "$RUNNER_TEMP/badging.txt"; then
            echo "::error::The APK asks for the camera"
            exit 1
          fi
          # No backup or device transfer of the WebView's storage, which holds the session token.
          "$tools/aapt2" dump xmltree --file AndroidManifest.xml "$apk" >"$RUNNER_TEMP/manifest.txt"
          grep -E ':(allowBackup|fullBackupContent|dataExtractionRules)\(' "$RUNNER_TEMP/manifest.txt"
          grep -qE ':allowBackup\(0x[0-9a-f]+\)=false' "$RUNNER_TEMP/manifest.txt"
          grep -qE ':dataExtractionRules\(0x[0-9a-f]+\)=@0x[0-9a-f]+' "$RUNNER_TEMP/manifest.txt"
          out="$RUNNER_TEMP/Copilot_${version}_arm64.apk"
          cp "$apk" "$out"
          {
            echo "| Artifact | Bytes |"
            echo "| --- | --- |"
            echo "| \`$(basename "$out")\` | $(stat -c %s "$out") |"
            echo
            echo "Signer certificate SHA-256: \`$signer\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "apk=$out" >>"$GITHUB_OUTPUT"

      - name: Upload the APK
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.apk.outputs.apk }}
          archive: false
          if-no-files-found: error
          retention-days: ${{ env.RETENTION_DAYS }}

  # The only job that may write to the repository, and only on a version tag: it creates the
  # tag's GitHub Release (or adds to one that exists) with this run's bundles and checksums.
  release:
    name: GitHub Release
    needs: [native-linux, native-android]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A tag must name the version in Cargo.toml and apps/native/package.json.
      - name: Version
        id: version
        run: |
          set -euo pipefail
          version="$(bash scripts/release.sh version)"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            bash scripts/release.sh check "$GITHUB_REF_NAME"
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Download the bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: Copilot_*
          path: ${{ runner.temp }}/bundles
          merge-multiple: true

      - name: Checksums and notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/release"
          mkdir -p "$dir"
          find "$RUNNER_TEMP/bundles" -type f -name 'Copilot_*' -exec mv -t "$dir" {} +
          for name in "Copilot_${VERSION}_amd64.deb" "Copilot_${VERSION}_amd64.AppImage" "Copilot_${VERSION}_arm64.apk"; do
            test -s "$dir/$name"
          done
          test "$(find "$dir" -type f | wc -l)" = 3
          (cd "$dir" && sha256sum Copilot_* >SHA256SUMS && sha256sum -c SHA256SUMS)
          bash scripts/release.sh notes "$VERSION" >"$RUNNER_TEMP/notes.md"
          {
            echo "Release files:"
            echo
            echo '```text'
            cat "$dir/SHA256SUMS"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/release"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$dir"/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            flags=()
            if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$TAG" "$dir"/* --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Copilot $TAG" --notes-file "$RUNNER_TEMP/notes.md" ${flags[@]+"${flags[@]}"}
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url | tee -a "$GITHUB_STEP_SUMMARY"
